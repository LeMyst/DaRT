name: Create Release

on:
  push:
    tags:
      - '*'
    branches: [ "master" ]
    paths:
    - 'Source-Files/**'
    - '.github/workflows/release.yaml'
  pull_request:
    branches: [ "master" ]
    paths:
    - 'Source-Files/**'
    - '.github/workflows/release.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        
    - name: Setup NuGet
      uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        
    - name: Restore NuGet Packages
      run: nuget restore DaRT.sln
      working-directory: ./Source-Files

    - name: Build DaRT
      run: msbuild DaRT.sln /p:Configuration=Release /p:DeployOnBuild=true /p:PublishProfile=FolderProfile /p:DebugSymbols=false /p:DebugType=None
      working-directory: ./Source-Files

    - name: Zip release folder
      run: 7z a -tzip DaRT.zip .
      working-directory: ./Source-Files/bin/Release

    - name: Upload Artifact DaRT
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: DaRT
        path: ./Source-Files/bin/Release/DaRT.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DaRT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            ./DaRT.zip
