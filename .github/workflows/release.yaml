name: Create Release

on:
  push:
    tags:
      - '*'
    branches: [ "master" ]
    paths:
    - 'Source-Files/**'
    - '.github/workflows/release.yaml'
  pull_request:
    branches: [ "master" ]
    paths:
    - 'Source-Files/**'
    - '.github/workflows/release.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        
    - name: Setup NuGet
      uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        
    - name: Restore NuGet Packages
      run: nuget restore DaRT.sln
      working-directory: ./Source-Files

    - name: Build DaRT
      run: msbuild DaRT.sln /p:Configuration=Release /p:DeployOnBuild=true /p:PublishProfile=FolderProfile /p:DebugSymbols=false /p:DebugType=None
      working-directory: ./Source-Files

    - name: Zip release folder
      run: 7z a -tzip DaRT.zip .
      working-directory: ./Source-Files/bin/Release

    - name: Upload Artifact DaRT
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: DaRT
        path: ./Source-Files/bin/Release/DaRT.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: DaRT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            ./DaRT.zip
